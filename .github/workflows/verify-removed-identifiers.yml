name: Verify removal of sensitive registration identifiers
on:
  pull_request:
    branches: [main]
  push:
    branches: [release/remove-sensitive-identifiers-2026-11-26]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Worker syntax
        run: node --check ANRSH-worker-counter.js
      - name: Verify registration fields and documents
        run: node tests/verify-removed-identifiers.mjs
