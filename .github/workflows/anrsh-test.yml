name: ANRSH isolated test checks

on:
  push:
    branches:
      - test/worker-counter-otp-10min
  workflow_dispatch:

jobs:
  syntax-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check Worker JavaScript syntax
        run: node --check ANRSH-worker-counter-test.js
      - name: Test isolated D1 schema and archive safety
        run: python -m unittest discover -s tests -p "test_*.py" -v
