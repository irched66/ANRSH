name: security-phase-1 static checks

on:
  push:
    branches: [security-phase-1]
  pull_request:
    branches: [security-phase-1]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check ANRSH-worker-counter.js
      - run: node tests/security-phase-1-static.mjs
